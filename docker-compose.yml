services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cheapestgo
      POSTGRES_PASSWORD: cheapestgo
      POSTGRES_DB: cheapestgo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheapestgo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  cron:
    build: ./docker/cron
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APP_URL: ${APP_URL:-http://api:4000}
      CRON_SECRET: ${CRON_SECRET}
      FUNCTIONS_SECRET: ${FUNCTIONS_SECRET}

volumes:
  postgres_data:
  redis_data:
