name: CI

# Mirrors v1's CI (cheapest-go-app/.github/workflows/ci.yml) so all three repos gate on
# the same idea, with two deliberate differences: the Prisma step below, and a wider set
# of checks. v1 runs type check and test only; this runs lint and build as well, so a
# deploy workflow added later cannot fail on something CI never looked at.

# Every branch and every pull request, rather than a named list. A list has to be edited
# each time someone cuts a branch, and the branch nobody added is the one that reaches
# staging unchecked. `pull_request` also covers the merge: it tests the merge result, not
# the branch tip, so a change that only breaks once combined is caught before it lands.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check:
    runs-on: ubuntu-latest

    # src/config.ts parses process.env with a zod schema at module load and calls
    # process.exit(1) when it fails, which vitest reports as "process.exit unexpectedly
    # called with 1". Four test files import it transitively, so without these the whole
    # run dies in seconds — which is why this workflow had never once passed.
    #
    # Only the five the schema requires: everything else in that schema is optional or
    # carries a default. Stubs, not secrets — no test opens a socket, and .env is
    # gitignored so CI has none. DATABASE_URL is never connected to.
    env:
      DATABASE_URL:       postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET:         ci-stub-not-a-secret
      JWT_REFRESH_SECRET: ci-stub-not-a-secret
      COOKIE_SECRET:      ci-stub-not-a-secret
      STRIPE_SECRET_KEY:  sk_test_stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm, not pnpm: this repo has package-lock.json. app-v2 is the opposite.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # --ignore-scripts skips postinstall, and this repo defines none anyway, so nothing
      # generates the Prisma client. Without it `@prisma/client` resolves to nothing and
      # the type check fails on every file that imports it — src/lib/prisma.ts and both
      # repositories. It must run before any step that compiles.
      - name: Generate Prisma client
        run: npx prisma generate

      # Each check runs even when an earlier one failed, so one red run lists everything
      # that needs fixing instead of revealing the next problem only after the last is
      # fixed. `!cancelled()` rather than `always()`: a cancelled run should stop.
      - name: Type check
        if: '!cancelled()'
        run: npm run type-check

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Test
        if: '!cancelled()'
        run: npm test

      - name: Build
        if: '!cancelled()'
        run: npm run build
