name: Deploy Dev

# FORHU/cheapest-go-app → the shared dev host (ap-southeast-1).
#
# One EC2 instance runs every project's dev environment. This workflow owns
# only its own container; it cannot touch another project's, and the deploy
# role cannot reach any host but this one.
#
# BEFORE THE FIRST RUN
#   1. Repository variable:
#        AWS_DEV_DEPLOY_ROLE_ARN = arn:aws:iam::617163942417:role/forhu-deploy
#      A new name on purpose: AWS_DEPLOY_ROLE_ARN already points at production
#      in several repos, and in gate-closes-api it switches the deploy target.
#   2. Check APP_PORT against this repo's Dockerfile — it is the port the
#      process listens on inside the container. HOST_PORT is allocated per
#      project and must not change; see /etc/caddy/sites/00-PORTS.md.
#   3. Put this project's own secrets in the `dev` environment, and list them
#      in the "Publish project env" step. DATABASE_URL, REDIS_URL and
#      RABBITMQ_URL come from the host — do NOT set them here.

on:
  # Dev tracks main. Without this the dev container only changes when somebody
  # remembers to dispatch, and it silently falls behind: on 2026-10-16 ilovelawyer
  # dev was 24h and several merges stale while production deployed on every merge,
  # which read as "changes not propagating" rather than as a missing trigger.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        # Which deployment this run targets. Everything that differs between them —
        # instance, ports, container names, SSM path — comes from that GitHub
        # environment's variables rather than from this file, so one workflow serves both.
        # A push to main has no input and therefore always means dev.
        description: "Target environment"
        type: choice
        options: [dev, production]
        default: dev
      ref:
        # No default on purpose: a hardcoded branch fetches something that may not
        # exist, failing in checkout before anything is built. Blank falls back to
        # github.ref_name, i.e. whichever branch you dispatch from.
        description: "Branch, tag or SHA to deploy (blank = the branch you ran this from)"
        required: false

concurrency:
  # Per environment: a dev deploy and a production deploy touch different hosts and must
  # not queue behind or cancel one another.
  group: forhu-cheapestgo-api-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

# Only what is the same wherever this deploys. Anything that differs by environment is
# resolved in the "Resolve target" step below, from that environment's variables.
env:
  AWS_REGION: ap-southeast-1
  ACCOUNT_ID: "617163942417"
  ECR_REPOSITORY: cheapestgo-v2-api
  APP_PORT: "4000"

jobs:
  deploy:
    name: Build and deploy (cheapestgo dev)
    # Runner arch follows the target: the dev host is Graviton, the production box is
    # x86_64. Build natively on both — do not cross-build under QEMU, where Node and
    # Prisma builds take hours and look hung.
    runs-on: ${{ inputs.environment == 'production' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    # "dev" is the context, not the environment's name — dev secrets and variables live on
    # the `staging` environment. Production maps to its own.
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Production sets AWS_DEPLOY_ROLE_ARN on its own environment. forhu-deploy, the dev
          # role, can only SendCommand to the dev host and only PutParameter under
          # /forhu-dev/* — against production it fails on the instance ARN, after the build.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEV_DEPLOY_ROLE_ARN || 'arn:aws:iam::617163942417:role/forhu-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      # Everything that differs between dev and production, in one place.
      #
      # Dev keeps working values as defaults so nothing has to be configured to deploy it.
      # Production has none: a missing production variable aborts rather than falling back,
      # because the fallback would deploy production code onto the dev instance — against
      # the dev database, with the dev SSM parameters — and report success doing it.
      - name: Resolve target
        id: cfg
        env:
          TARGET:           ${{ inputs.environment || 'dev' }}
          V_INSTANCE_ID:    ${{ vars.INSTANCE_ID }}
          V_NETWORK:        ${{ vars.DOCKER_NETWORK }}
          V_CONTAINER:      ${{ vars.CONTAINER_NAME }}
          V_CRON_CONTAINER: ${{ vars.CRON_CONTAINER_NAME }}
          V_HOST_PORT:      ${{ vars.HOST_PORT }}
          V_ENV_PARAM:      ${{ vars.ENV_PARAM }}
          V_SHARED_ENV:     ${{ vars.SHARED_ENV }}
          V_MERGED_ENV:     ${{ vars.MERGED_ENV }}
        run: |
          set -euo pipefail

          if [ "$TARGET" = "production" ]; then
            missing=""
            for v in V_INSTANCE_ID V_NETWORK V_CONTAINER V_CRON_CONTAINER \
                     V_HOST_PORT V_ENV_PARAM V_SHARED_ENV V_MERGED_ENV; do
              [ -n "${!v:-}" ] || missing="$missing ${v#V_}"
            done
            if [ -n "$missing" ]; then
              echo "::error::production environment is missing:$missing"
              echo "Set them as variables on the 'production' environment, then re-run." >&2
              exit 1
            fi
          fi

          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # The tag prefix keeps a dev image from ever being mistaken for, or overwriting,
          # a production one in the same ECR repository.
          [ "$TARGET" = "production" ] && out tag_prefix prod || out tag_prefix dev

          # The dev host is Graviton; the production box is x86_64 (t3 family). One
          # image cannot serve both: the wrong arch pulls cleanly and then dies with
          # "exec format error", which reads as a crash loop rather than a build fault.
          [ "$TARGET" = "production" ] && out platform linux/amd64 || out platform linux/arm64

          out instance_id    "${V_INSTANCE_ID:-i-0f95a93145ea25e7a}"
          out network        "${V_NETWORK:-forhu-dev}"
          out container      "${V_CONTAINER:-cheapestgo-v2-api}"
          # The scheduler. Same ECR repository under a distinct tag prefix rather than a
          # repository of its own: a second repo needs `ecr:CreateRepository` on the OIDC
          # role, and this image is alpine + curl + supercronic + the crontab.
          out cron_container "${V_CRON_CONTAINER:-cheapestgo-v2-cron}"
          out host_port      "${V_HOST_PORT:-4041}"
          out env_param      "${V_ENV_PARAM:-/forhu-dev/cheapestgo-v2-api/env}"
          out shared_env     "${V_SHARED_ENV:-/opt/forhu-dev/credentials/cheapestgo.env}"
          out merged_env     "${V_MERGED_ENV:-/opt/forhu-dev/cheapestgo-v2-api.env}"

          echo "Target: $TARGET"

      - name: Resolve image tag
        id: tag
        run: |
          echo "tag=${{ steps.cfg.outputs.tag_prefix }}-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.tag.outputs.registry }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ steps.cfg.outputs.platform }}
          provenance: false
          tags: ${{ steps.tag.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      # The scheduler image. Every job in docker/cron/crontab — the credit check, the
      # dest-cache fill, the hotel-content refresh, the supplier-health probe — exists only
      # in docker-compose.yml today, which is local development. Nothing scheduled has ever
      # run in a deployed environment.
      - name: Build and push cron image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/cron
          file: ./docker/cron/Dockerfile
          push: true
          platforms: ${{ steps.cfg.outputs.platform }}
          provenance: false
          tags: ${{ steps.tag.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cron-${{ steps.tag.outputs.tag }}

      # This project's own secrets only. Anything unset is omitted rather than
      # written empty: an empty value looks configured and silently disables
      # whatever reads it, which is how three features were found dead on the
      # UK stack.
      - name: Publish project env to Parameter Store
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || vars.ANTHROPIC_API_KEY }}
          CHAT_WONDER_API_KEY: ${{ secrets.CHAT_WONDER_API_KEY || vars.CHAT_WONDER_API_KEY }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET || vars.COOKIE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
          DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN || vars.DUFFEL_ACCESS_TOKEN }}
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN || vars.DUFFEL_TOKEN }}
          DUFFEL_WEBHOOK_SECRET: ${{ secrets.DUFFEL_WEBHOOK_SECRET || vars.DUFFEL_WEBHOOK_SECRET }}
          EXCHANGE_RATES_API_KEY: ${{ secrets.EXCHANGE_RATES_API_KEY || vars.EXCHANGE_RATES_API_KEY }}
          FUNCTIONS_SECRET: ${{ secrets.FUNCTIONS_SECRET || vars.FUNCTIONS_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || vars.GOOGLE_CLIENT_SECRET }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY || vars.GOOGLE_PLACES_API_KEY }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || vars.JWT_REFRESH_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN || vars.MAPBOX_TOKEN }}
          MOBILE_API_KEY: ${{ secrets.MOBILE_API_KEY || vars.MOBILE_API_KEY }}
          MYSTIFLY_PASSWORD: ${{ secrets.MYSTIFLY_PASSWORD || vars.MYSTIFLY_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || vars.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || vars.STRIPE_WEBHOOK_SECRET }}
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
          BRAND_EMAIL: ${{ secrets.BRAND_EMAIL || vars.BRAND_EMAIL }}
          BRAND_NAME: ${{ secrets.BRAND_NAME || vars.BRAND_NAME }}
          CHAT_WONDER_API_URL: ${{ secrets.CHAT_WONDER_API_URL || vars.CHAT_WONDER_API_URL }}
          CHAT_WONDER_MODEL: ${{ secrets.CHAT_WONDER_MODEL || vars.CHAT_WONDER_MODEL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN || vars.CORS_ORIGIN }}
          DUFFEL_BALANCE_ALERT_THRESHOLD: ${{ secrets.DUFFEL_BALANCE_ALERT_THRESHOLD || vars.DUFFEL_BALANCE_ALERT_THRESHOLD }}
          DUFFEL_BALANCE_CHECK: ${{ secrets.DUFFEL_BALANCE_CHECK || vars.DUFFEL_BALANCE_CHECK }}
          FLIGHT_PRICE_TOLERANCE: ${{ secrets.FLIGHT_PRICE_TOLERANCE || vars.FLIGHT_PRICE_TOLERANCE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL || vars.INTERNAL_API_URL }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || vars.JWT_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN || vars.JWT_REFRESH_EXPIRES_IN }}
          MOBILE_GUEST_USER_ID: ${{ secrets.MOBILE_GUEST_USER_ID || vars.MOBILE_GUEST_USER_ID }}
          MYSTIFLY_ACCOUNT_NUMBER: ${{ secrets.MYSTIFLY_ACCOUNT_NUMBER || vars.MYSTIFLY_ACCOUNT_NUMBER }}
          MYSTIFLY_USERNAME: ${{ secrets.MYSTIFLY_USERNAME || vars.MYSTIFLY_USERNAME }}
          NEXT_PUBLIC_BRAND_EMAIL: ${{ secrets.NEXT_PUBLIC_BRAND_EMAIL || vars.NEXT_PUBLIC_BRAND_EMAIL }}
          NEXT_PUBLIC_BRAND_NAME: ${{ secrets.NEXT_PUBLIC_BRAND_NAME || vars.NEXT_PUBLIC_BRAND_NAME }}
          # Extra origins a Google sign-in may return to. SITE_URL is always allowed and
          # need not appear here; anything unlisted falls back to it. Unset is the previous
          # behaviour exactly, so this is safe to leave empty.
          OAUTH_RETURN_ORIGINS: ${{ secrets.OAUTH_RETURN_ORIGINS || vars.OAUTH_RETURN_ORIGINS }}
          SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
          STRIPE_EXPECTED_ACCOUNT: ${{ secrets.STRIPE_EXPECTED_ACCOUNT || vars.STRIPE_EXPECTED_ACCOUNT }}
          SUPPORT_ATTACHMENTS_BUCKET: ${{ secrets.SUPPORT_ATTACHMENTS_BUCKET || vars.SUPPORT_ATTACHMENTS_BUCKET }}
          TRANSLATION_BASE_URL: ${{ secrets.TRANSLATION_BASE_URL || vars.TRANSLATION_BASE_URL }}
          # TravelgateX has no sandbox for hotels, so dev necessarily uses the LIVE
          # credentials. Search is read-only and safe to exercise here. Prebook and
          # book are not: they reach the real supplier and create real reservations
          # against real inventory, with no marker distinguishing them from a
          # customer's. Nothing in this configuration prevents that — only the
          # person using the environment does.
          TRAVELGATEX_API_KEY: ${{ secrets.TRAVELGATEX_API_KEY || vars.TRAVELGATEX_API_KEY }}
          TRAVELGATEX_CODE: ${{ secrets.TRAVELGATEX_CODE || vars.TRAVELGATEX_CODE }}
        run: |
          set -euo pipefail
          umask 077

          # PORT must match APP_PORT above and the Dockerfile's EXPOSE, or Caddy
          # proxies to a port nothing listens on.
          printf 'NODE_ENV=production\n'                   > env.tmp
          printf 'PORT=%s\n' '${{ env.APP_PORT }}'        >> env.tmp
          printf 'AWS_REGION=%s\n' '${{ env.AWS_REGION }}' >> env.tmp

          # No AWS_ACCESS_KEY / AWS_SECRET_ACCESS_KEY, though the local .env has
          # them: on this host the instance role supplies credentials, and an
          # explicit pair makes the SDK stop walking its provider chain.
          #
          # Hotel suppliers are deliberately absent — TRAVELGATE*, TGX_*, ETG_*,
          # RATEHAWK_*, ONDA_*, OTV_*. Unlike Duffel and Mystifly they have no
          # sandbox, and this codebase has no dry-run flag, so live keys would
          # let a dev tester create a real reservation at a real hotel.
          #
          # Written only when set. `add` returns 0 on purpose: under `set -e` a
          # bare `[ -n "$x" ] && printf ...` aborts on the first empty value.
          add() { [ -n "${2:-}" ] && printf '%s=%s\n' "$1" "$2" >> env.tmp; return 0; }

          add ANTHROPIC_API_KEY                "${ANTHROPIC_API_KEY:-}"
          add API_URL                          "${API_URL:-}"
          add BRAND_EMAIL                      "${BRAND_EMAIL:-}"
          add BRAND_NAME                       "${BRAND_NAME:-}"
          add CHAT_WONDER_API_KEY              "${CHAT_WONDER_API_KEY:-}"
          add CHAT_WONDER_API_URL              "${CHAT_WONDER_API_URL:-}"
          add CHAT_WONDER_MODEL                "${CHAT_WONDER_MODEL:-}"
          add COOKIE_SECRET                    "${COOKIE_SECRET:-}"
          add CORS_ORIGIN                      "${CORS_ORIGIN:-}"
          add CRON_SECRET                      "${CRON_SECRET:-}"
          add DUFFEL_ACCESS_TOKEN              "${DUFFEL_ACCESS_TOKEN:-}"
          add DUFFEL_BALANCE_ALERT_THRESHOLD   "${DUFFEL_BALANCE_ALERT_THRESHOLD:-}"
          add DUFFEL_BALANCE_CHECK             "${DUFFEL_BALANCE_CHECK:-}"
          add DUFFEL_TOKEN                     "${DUFFEL_TOKEN:-}"
          add DUFFEL_WEBHOOK_SECRET            "${DUFFEL_WEBHOOK_SECRET:-}"
          add EXCHANGE_RATES_API_KEY           "${EXCHANGE_RATES_API_KEY:-}"
          add FLIGHT_PRICE_TOLERANCE           "${FLIGHT_PRICE_TOLERANCE:-}"
          add FUNCTIONS_SECRET                 "${FUNCTIONS_SECRET:-}"
          add GOOGLE_CLIENT_ID                 "${GOOGLE_CLIENT_ID:-}"
          add GOOGLE_CLIENT_SECRET             "${GOOGLE_CLIENT_SECRET:-}"
          add GOOGLE_PLACES_API_KEY            "${GOOGLE_PLACES_API_KEY:-}"
          add INTERNAL_API_URL                 "${INTERNAL_API_URL:-}"
          add JWT_EXPIRES_IN                   "${JWT_EXPIRES_IN:-}"
          add JWT_REFRESH_EXPIRES_IN           "${JWT_REFRESH_EXPIRES_IN:-}"
          add JWT_REFRESH_SECRET               "${JWT_REFRESH_SECRET:-}"
          add JWT_SECRET                       "${JWT_SECRET:-}"
          add MAPBOX_TOKEN                     "${MAPBOX_TOKEN:-}"
          add MOBILE_API_KEY                   "${MOBILE_API_KEY:-}"
          add MOBILE_GUEST_USER_ID             "${MOBILE_GUEST_USER_ID:-}"
          add MYSTIFLY_ACCOUNT_NUMBER          "${MYSTIFLY_ACCOUNT_NUMBER:-}"
          add MYSTIFLY_PASSWORD                "${MYSTIFLY_PASSWORD:-}"
          add MYSTIFLY_USERNAME                "${MYSTIFLY_USERNAME:-}"
          add NEXT_PUBLIC_BRAND_EMAIL          "${NEXT_PUBLIC_BRAND_EMAIL:-}"
          add NEXT_PUBLIC_BRAND_NAME           "${NEXT_PUBLIC_BRAND_NAME:-}"
          add OAUTH_RETURN_ORIGINS             "${OAUTH_RETURN_ORIGINS:-}"
          add RESEND_API_KEY                   "${RESEND_API_KEY:-}"
          add SITE_URL                         "${SITE_URL:-}"
          add STRIPE_EXPECTED_ACCOUNT          "${STRIPE_EXPECTED_ACCOUNT:-}"
          add STRIPE_SECRET_KEY                "${STRIPE_SECRET_KEY:-}"
          add STRIPE_WEBHOOK_SECRET            "${STRIPE_WEBHOOK_SECRET:-}"
          add SUPPORT_ATTACHMENTS_BUCKET       "${SUPPORT_ATTACHMENTS_BUCKET:-}"
          add TRANSLATION_BASE_URL             "${TRANSLATION_BASE_URL:-}"
          add TRAVELGATEX_API_KEY              "${TRAVELGATEX_API_KEY:-}"
          add TRAVELGATEX_CODE                 "${TRAVELGATEX_CODE:-}"

          aws ssm put-parameter \
            --name "${{ steps.cfg.outputs.env_param }}" \
            --type SecureString --overwrite \
            --value "file://env.tmp" \
            --region "${{ env.AWS_REGION }}" > /dev/null
          rm -f env.tmp

      - name: Deploy via SSM
        id: send
        env:
          REGISTRY: ${{ steps.tag.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}"
          CRON_IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:cron-${TAG}"

          COMMANDS=(
            "set -euo pipefail"
            "cat ${{ steps.cfg.outputs.shared_env }} > ${{ steps.cfg.outputs.merged_env }}"
            "aws ssm get-parameter --name ${{ steps.cfg.outputs.env_param }} --with-decryption --region ${{ env.AWS_REGION }} --query Parameter.Value --output text >> ${{ steps.cfg.outputs.merged_env }}"
            "chmod 600 ${{ steps.cfg.outputs.merged_env }}"
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}"
            "docker container prune -f || true"
            "docker image prune -af || true"
            "docker pull --platform ${{ steps.cfg.outputs.platform }} ${IMAGE}"
            "docker rm -f ${{ steps.cfg.outputs.container }} 2>/dev/null || true"
            "docker run -d --name ${{ steps.cfg.outputs.container }} --restart unless-stopped --platform ${{ steps.cfg.outputs.platform }} --network ${{ steps.cfg.outputs.network }} --env-file ${{ steps.cfg.outputs.merged_env }} -p 127.0.0.1:${{ steps.cfg.outputs.host_port }}:${{ env.APP_PORT }} ${IMAGE}"
            "docker pull --platform ${{ steps.cfg.outputs.platform }} ${CRON_IMAGE}"
            "docker rm -f ${{ steps.cfg.outputs.cron_container }} 2>/dev/null || true"
            # APP_URL is set here rather than taken from the env file: the jobs call the API
            # over the Docker network by container name, never back out through the public
            # hostname, so the cron endpoints need no public exposure. No trailing slash —
            # the crontab appends the path.
            "docker run -d --name ${{ steps.cfg.outputs.cron_container }} --restart unless-stopped --platform ${{ steps.cfg.outputs.platform }} --network ${{ steps.cfg.outputs.network }} --env-file ${{ steps.cfg.outputs.merged_env }} -e APP_URL=http://${{ steps.cfg.outputs.container }}:${{ env.APP_PORT }} ${CRON_IMAGE}"
          )

          # jq builds the JSON, so a quote inside any command cannot break it.
          PARAMS=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -sc '{commands: .}')

          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ steps.cfg.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ steps.cfg.outputs.container }} ${TAG}" \
            --timeout-seconds 900 \
            --parameters "${PARAMS}" \
            --query Command.CommandId --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy
        run: |
          set -uo pipefail
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "${{ steps.cfg.outputs.instance_id }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ steps.cfg.outputs.instance_id }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::deploy $STATUS"; exit 1; }
